; Safety net for issue #97: the target host ships
; zend.exception_ignore_args = 0, so without this a fatal error BEFORE
; bootstrap.php runs (a syntax error in the autoloader, a failing require)
; would print and log a stack trace including its call arguments - which on
; this application can be a password or decrypted receipt data.
;
; .user.ini and not .htaccess on purpose: the host runs PHP as fpm-fcgi
; (hosting finding M0), where php_value/php_flag in .htaccess is not
; understood by Apache and answers every request with a 500.
;
; PHP reads .user.ini from the executed script's directory upwards, and the
; executed script is the shim in the docroot - so this file belongs next to
; it, not into current/.
zend.exception_ignore_args = On
display_errors = Off
