; Mirrors the restrictions of the target shared hosting (CLAUDE.md section 1
; and the M0 hosting findings in docs/hosting-befunde.md).
disable_functions = exec,passthru,popen,proc_open,shell_exec,system,pcntl_exec
memory_limit = 256M
; The host measured 60 s; staying at 30 s locally keeps dev the stricter of
; the two, so a step chain that fits here fits there as well.
max_execution_time = 30
upload_max_filesize = 64M
post_max_size = 64M
expose_php = Off

; Keep function arguments OUT of exception stack traces (CLAUDE.md section 4).
; A logged trace of a failing login would otherwise carry the plaintext
; password - and on this application also the vault key and receipt data - as
; call arguments. The target host ships this OFF (issue #97), so bootstrap.php
; sets it at runtime as well and the error handler never logs the full
; exception string: three layers, because one of them is not ours to control.
zend.exception_ignore_args = On

; Deliberately NOT Europe/Berlin: only bootstrap may set the timezone, so
; any code path bypassing bootstrap shows up as a time offset in dev.
date.timezone = UTC

; Dev convenience (production has this off).
display_errors = On
