name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          # The hosting-check database probes need an existing schema.
          MARIADB_DATABASE: vereinsbelege
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip, gd, sodium, curl, mbstring, fileinfo
          coverage: none
          # zend.exception_ignore_args is deliberately left at 0 here: the
          # target host ships it off (issue #97), so CI runs in the worse of
          # the two worlds and the tests have to hold there.
          # Both trace settings are left in the WORSE of the two possible
          # states here (args kept, parameters not capped), i.e. worse than
          # the target host itself: the tests have to hold there.
          ini-values: error_reporting=E_ALL, display_errors=On, zend.assertions=1, zend.exception_ignore_args=0, zend.exception_string_param_max_len=15

      - name: Validate composer files
        run: composer validate --no-check-publish

      # setup.php is generated from bin/setup.template.php plus the shared
      # ReleaseDownloader. A stale copy is what a fresh installation would
      # actually run, so it is regenerated and diffed rather than trusted.
      - name: Verify generated setup.php is up to date
        run: |
          php bin/build_setup.php
          git diff --exit-code setup.php
          php -l setup.php

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint every PHP file
        run: find app bin public tools tests worker -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests (deprecations fail the build)
        run: vendor/bin/phpunit
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-root
          TEST_DB_REQUIRED: '1'
          HC_TEST_DB_HOST: 127.0.0.1
          HC_TEST_DB_NAME: vereinsbelege
          HC_TEST_DB_USER: root
          HC_TEST_DB_PASS: ci-root

      - name: Run client-side JS tests
        run: node --test tests/js/*.test.js

  # Issue #82/M13-5: reports < 3 s, inbox < 1 s on 3 000 receipts and
  # 5 000 bookings. A job of its own, next to "tests": building the data
  # set takes a while, the normal suite must not wait for it. The phpunit
  # group is excluded from the default run in phpunit.xml.
  performance:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip, gd, sodium, curl, mbstring, fileinfo
          coverage: none
          # memory_limit as on the host (docs/hosting-befunde.md: 384 MiB
          # measured; the dev container's 256M is the stricter value).
          ini-values: error_reporting=E_ALL, display_errors=On, zend.assertions=1, memory_limit=256M

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Measure reports and inbox
        run: |
          echo "## Performance-Test (issue #82)" >> "$GITHUB_STEP_SUMMARY"
          echo "Umgebung: GitHub-Runner ubuntu-latest, MariaDB 10.11 (Service-Container)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          vendor/bin/phpunit --group performance
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-root
          TEST_DB_REQUIRED: '1'
          PERF_REPORT_FILE: ${{ github.workspace }}/perf-report.md

      - name: Publish measurements
        if: always()
        run: if [ -f perf-report.md ]; then cat perf-report.md >> "$GITHUB_STEP_SUMMARY"; fi
