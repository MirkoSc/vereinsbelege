name: Release

on:
  push:
    tags: ['v*.*.*']

# Read-only by default (issue #241): only the publish job may write, and only
# the publish job sees the signing secret. The build job runs composer and
# the ZIP tooling without either.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip, sodium
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Write VERSION from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # docker/web/ carries the three docroot files - shim, .htaccess,
      # .user.ini (docs/spec/06-betrieb.md section 1). setup.php copies them
      # from the unpacked release and the updater keeps them up to date, so
      # they have to travel with it. The rest of docker/ stays out: it is the
      # development environment and holds the dev database password.
      # The root .htaccess denies all access to the release directory, i.e.
      # to current/ once it is switched in (issue #101); DenyHtaccessTest
      # keeps it identical to DenyHtaccess::CONTENT.
      # The optional worker (worker/, bin/worker.php) runs in its own
      # container and stays out (docs/spec/07-worker.md section 8).
      - name: Build release ZIP
        run: |
          mkdir -p dist
          zip -r "dist/vereinsbelege-${GITHUB_REF_NAME}.zip" \
            app public vendor bin migrations VERSION docker/web .htaccess
          zip -d "dist/vereinsbelege-${GITHUB_REF_NAME}.zip" bin/worker.php

      - name: Stage setup.php (exists from milestone M1-2 on)
        run: if [ -f setup.php ]; then cp setup.php dist/; fi

      # First the release assets (what the updater and setup.php check the
      # download against), then one line per file inside the ZIP, its path
      # prefixed with "release/": the per-file checksums of the code
      # integrity check (docs/spec/01-sicherheit.md section 8, issue #79).
      # Hashed from the unpacked ZIP, so they describe exactly what lands in
      # current/. `sha256sum -c --ignore-missing checksums.txt` in a download
      # folder still checks the assets.
      - name: Generate checksums
        run: |
          cd dist && sha256sum * > checksums.txt
          mkdir ../release-dateien && cd ../release-dateien
          unzip -q "../dist/vereinsbelege-${GITHUB_REF_NAME}.zip"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
            | sed 's#^\([0-9a-f]\{64\}\)  \./#\1  release/#' >> ../dist/checksums.txt
          grep -q '^[0-9a-f]\{64\}  release/VERSION$' ../dist/checksums.txt

      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for tools/release-signatur.php and the public key in
      # app/src/Service/Update/ReleaseSignatur.php of the tagged commit; no
      # token left behind in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # Ed25519 signature over checksums.txt -> checksums.txt.sig (issue
      # #241, docs/betrieb.md "Release-Signatur"). The list names the hash of
      # the ZIP and of every file in it, so this one signature covers both.
      # Without the secret the tool only warns - as long as no public key is
      # fixed in ReleaseSignatur. Once one is, a missing or non-matching
      # secret fails the release instead of publishing one that every
      # installation would refuse.
      - name: Sign checksums.txt
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: php tools/release-signatur.php signieren dist/checksums.txt

      # Every tag starts as a pre-release for the beta test instance;
      # promoting it to "latest" for the stable channel is a manual step
      # in the GitHub UI.
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
