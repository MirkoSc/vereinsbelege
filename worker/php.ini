; PHP settings of the worker image (docs/spec/07-worker.md section 7).
; As on the web host (CLAUDE.md section 4): no arguments in stack traces,
; errors to stderr (the container log), never into a file.
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
error_reporting = E_ALL
display_errors = stderr
log_errors = Off
expose_php = Off
; The worker has no time limit (that is what it is for); the memory limit
; comes from WORKER_SPEICHER (bin/worker.php).
max_execution_time = 0
